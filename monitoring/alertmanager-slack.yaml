alertmanager:
  alertmanagerSpec:
    secrets: [alertmanager-slack]
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace, pod]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: "null"
          matchers: ['alertname = "InfoInhibitor"']
        - receiver: slack-todo
          matchers: ['team = "todo"']
    inhibit_rules:
      - source_matchers: ['alertname = "TodoMongoDown"']
        target_matchers: ['alertname = "TodoReadinessProbeFailures"']
        equal: [namespace]
    receivers:
      - name: "null"
      - name: slack-todo
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            channel: "#k8s-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*Severity:* {{ .Labels.severity }}
              {{ if .Labels.pod }}*Pod:* {{ .Labels.pod }}{{ else if .Labels.deployment }}*Deployment:* {{ .Labels.deployment }}{{ end }}
              *Summary:* {{ .Annotations.summary }}
              *Details:* {{ .Annotations.description }}
              {{ end }}
