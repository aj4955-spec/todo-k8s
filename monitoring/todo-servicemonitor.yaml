apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todo-app
  namespace: monitoring
  labels:
    release: mon
spec:
  namespaceSelector:
    matchNames:
      - todo
  selector:
    matchLabels:
      app: todo-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
