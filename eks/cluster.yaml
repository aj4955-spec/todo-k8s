apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: todo-eks
  region: us-east-1
  tags: {project: cloud-a2}
vpc:
  nat:
    gateway: Disable
iam:
  withOIDC: true
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
managedNodeGroups:
  - name: ng-1
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    labels: {role: worker}
