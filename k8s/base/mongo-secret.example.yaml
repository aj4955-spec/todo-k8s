# Example only. Do NOT put the real password here.
# Create the real Secret with:
#   kubectl create secret generic mongo-credentials -n todo \
#     --from-literal=MONGO_USER=todo_admin \
#     --from-literal=MONGO_PASSWORD='<letters-and-digits-only>'
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: todo
type: Opaque
stringData:
  MONGO_USER: todo_admin
  MONGO_PASSWORD: change-me
