apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - storageclass-gp3.yaml
patches:
  - target:
      kind: Service
      name: todo-app
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
  - target:
      kind: PersistentVolumeClaim
      name: mongo-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: gp3
