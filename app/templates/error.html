<!DOCTYPE html>
<html>
<head>
  <title>{{ t }} - Error {{ code }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/style.css') }}">
  <style>
    .error-box { max-width: 560px; margin: 80px auto; text-align: center; font-family: sans-serif; }
    .error-code { font-size: 64px; font-weight: bold; color: #c0392b; margin: 0; }
    .error-msg { font-size: 18px; margin: 16px 0 28px; }
    .error-box a { color: #2c7be5; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="error-box">
    <p class="error-code">{{ code }}</p>
    <p class="error-msg">{{ message }}</p>
    <a href="/">Back to my tasks</a>
  </div>
  <footer style="margin-top:30px;padding:8px 0;border-top:1px solid #ddd;color:#777;font-size:12px;font-family:sans-serif;">Version <b>{{ app_version }}</b> &middot; served by pod <b>{{ pod_name }}</b></footer>
</body>
</html>
